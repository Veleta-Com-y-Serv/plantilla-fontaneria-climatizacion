secciones:
  hero:
    activa: true
    antetitulo: Fontaneros y calefactores en Calatayud
    titulo: Tu avería, resuelta hoy
    texto: "Fugas, desatascos y calderas en Calatayud. Te decimos a qué hora llegamos."
